name: Build Android APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build signed Multi-ABI APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.caching=true"
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate repository image
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="yaraniha.png"

          if [ ! -s "$IMAGE" ]; then
            echo "ERROR: $IMAGE is missing or empty in repository root."
            exit 1
          fi

          INFO="$(file "$IMAGE")"
          echo "$INFO"
          case "$INFO" in
            *"PNG image data"*) ;;
            *) echo "ERROR: $IMAGE is not a valid PNG."; exit 1 ;;
          esac

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found at $SDKMANAGER"
            exit 1
          fi

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;27.0.12077973"

      - name: Restore signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          KEYSTORE_FILE="$GITHUB_WORKSPACE/yaraniha.keystore"

          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v:-}" ]; then
              echo "ERROR: required signing secret is missing: $v"
              exit 1
            fi
          done

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"

          test -s "$KEYSTORE_FILE"
          chmod 600 "$KEYSTORE_FILE"

          echo "Keystore restored:"
          ls -lh "$KEYSTORE_FILE"

      - name: Validate signing key before build
        shell: bash
        run: |
          set -euo pipefail

          KEYSTORE_FILE="$GITHUB_WORKSPACE/yaraniha.keystore"

          keytool -list -v \
            -keystore "$KEYSTORE_FILE" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            > /tmp/signing-key.txt

          grep -m1 '^Alias name:' /tmp/signing-key.txt || true

          FP="$(grep -m1 -E '^[[:space:]]*SHA256:' /tmp/signing-key.txt \
            | sed -E 's/^[[:space:]]*SHA256:[[:space:]]*//' \
            | tr -d ':[:space:]' | tr 'A-F' 'a-f' || true)"

          if [ -z "$FP" ]; then
            echo "ERROR: could not read SHA-256 fingerprint of the signing key."
            exit 1
          fi

          echo "Expected signing certificate SHA-256: $FP"
          echo "KEYSTORE_CERT_SHA256=$FP" >> "$GITHUB_ENV"

      - name: Generate Android project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p app/src/main/java/com/mohammadkhxm/browser
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/values-night
          mkdir -p app/src/main/res/xml

          # ---------------------------------------------------------------
          # Launcher icons: resize the repository image to every density
          # (avoids shipping one huge PNG as the icon).
          # ---------------------------------------------------------------
          IM="$(command -v magick || command -v convert || true)"
          if [ -z "$IM" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq imagemagick
            IM="$(command -v magick || command -v convert)"
          fi

          for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d="${pair%%:*}"
            s="${pair##*:}"
            mkdir -p "app/src/main/res/mipmap-$d"
            "$IM" yaraniha.png -strip -resize "${s}x${s}" \
              -background none -gravity center -extent "${s}x${s}" \
              "app/src/main/res/mipmap-$d/ic_launcher.png"
          done

          # ---------------------------------------------------------------
          # Real native marker libraries (compiled by the NDK) so every
          # ABI split is a genuine per-ABI APK. 16 KB page-size compatible.
          # ---------------------------------------------------------------
          cat > /tmp/yaraniha_abi_marker.c <<'EOF'
          __attribute__((visibility("default")))
          void yaraniha_abi_marker(void) {}
          EOF

          NDK="$ANDROID_HOME/ndk/27.0.12077973"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          declare -A TRIPLES=(
            [arm64-v8a]=aarch64-linux-android
            [armeabi-v7a]=armv7a-linux-androideabi
            [x86]=i686-linux-android
            [x86_64]=x86_64-linux-android
          )

          for abi in "${!TRIPLES[@]}"; do
            mkdir -p "app/src/main/jniLibs/$abi"
            "$TOOLCHAIN/${TRIPLES[$abi]}23-clang" \
              -shared -fPIC -O2 -s \
              -Wl,-z,max-page-size=16384 -Wl,-z,noexecstack \
              /tmp/yaraniha_abi_marker.c \
              -o "app/src/main/jniLibs/$abi/libyaraniha_abi.so"
            file "app/src/main/jniLibs/$abi/libyaraniha_abi.so"
          done

          # ===============================================================
          # AndroidManifest.xml
          # ===============================================================
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <uses-permission
                  android:name="android.permission.WRITE_EXTERNAL_STORAGE"
                  android:maxSdkVersion="28" />

              <uses-feature
                  android:name="android.hardware.camera"
                  android:required="false" />

              <uses-feature
                  android:name="android.hardware.camera.autofocus"
                  android:required="false" />

              <uses-feature
                  android:name="android.hardware.microphone"
                  android:required="false" />

              <uses-feature
                  android:name="android.hardware.touchscreen"
                  android:required="false" />

              <application
                  android:allowBackup="false"
                  android:hardwareAccelerated="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:label="Yaraniha"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme"
                  android:networkSecurityConfig="@xml/network_security_config"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|smallestScreenSize|screenLayout|keyboard|keyboardHidden|navigation|uiMode|density|layoutDirection|fontScale|locale"
                      android:exported="true"
                      android:hardwareAccelerated="true"
                      android:launchMode="singleTask"
                      android:screenOrientation="user"
                      android:windowSoftInputMode="adjustResize">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          # ===============================================================
          # Network Security Config
          # ===============================================================
          cat > app/src/main/res/xml/network_security_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted="true" />
          </network-security-config>
          EOF

          # ===============================================================
          # MainActivity.kt
          # ===============================================================
          cat > app/src/main/java/com/mohammadkhxm/browser/MainActivity.kt <<'EOF'
          package com.mohammadkhxm.browser

          import android.Manifest
          import android.annotation.SuppressLint
          import android.app.Activity
          import android.app.DownloadManager
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ActivityInfo
          import android.content.pm.PackageManager
          import android.database.ContentObserver
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Environment
          import android.os.Handler
          import android.os.Looper
          import android.provider.Settings
          import android.webkit.CookieManager
          import android.webkit.DownloadListener
          import android.webkit.PermissionRequest
          import android.webkit.SslErrorHandler
          import android.webkit.URLUtil
          import android.webkit.ValueCallback
          import android.webkit.WebChromeClient
          import android.webkit.WebResourceError
          import android.webkit.WebResourceRequest
          import android.webkit.WebResourceResponse
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.Toast
          import androidx.activity.OnBackPressedCallback
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat

          class MainActivity : AppCompatActivity() {

              private var webView: WebView? = null
              private var filePathCallback: ValueCallback<Array<Uri>>? = null
              private var pendingPermissionRequest: PermissionRequest? = null
              private var pendingDownload: (() -> Unit)? = null

              // Follows the system auto-rotate toggle live.
              private val rotationObserver =
                  object : ContentObserver(Handler(Looper.getMainLooper())) {
                      override fun onChange(selfChange: Boolean) {
                          applyRotationPolicy()
                      }
                  }

              companion object {
                  private const val WEBSITE_URL = "https://app.yaran.info"
                  private const val WEBSITE_HOST = "app.yaran.info"
                  private const val FILE_CHOOSER_REQUEST_CODE = 1001
                  private const val WEB_PERMISSION_REQUEST_CODE = 2002
                  private const val STORAGE_REQUEST_CODE = 2003
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  applyRotationPolicy()
                  setContentView(R.layout.activity_main)

                  try {
                      contentResolver.registerContentObserver(
                          Settings.System.getUriFor(Settings.System.ACCELEROMETER_ROTATION),
                          false,
                          rotationObserver
                      )
                  } catch (_: Exception) {
                  }

                  webView = findViewById(R.id.webView)
                  setupWebView()
                  setupBackNavigation()

                  if (savedInstanceState == null) {
                      webView?.loadUrl(WEBSITE_URL)
                  } else {
                      webView?.restoreState(savedInstanceState)
                  }
              }

              override fun onResume() {
                  super.onResume()
                  applyRotationPolicy()
              }

              private fun applyRotationPolicy() {
                  val autoRotate = try {
                      Settings.System.getInt(
                          contentResolver,
                          Settings.System.ACCELEROMETER_ROTATION,
                          1
                      ) == 1
                  } catch (_: Exception) {
                      true
                  }

                  val target = if (autoRotate) {
                      ActivityInfo.SCREEN_ORIENTATION_USER
                  } else {
                      ActivityInfo.SCREEN_ORIENTATION_LOCKED
                  }

                  if (requestedOrientation != target) {
                      requestedOrientation = target
                  }
              }

              private fun hasPermission(permission: String): Boolean =
                  ContextCompat.checkSelfPermission(this, permission) ==
                      PackageManager.PERMISSION_GRANTED

              private fun handleScheme(uri: Uri): Boolean {
                  return when (uri.scheme?.lowercase()) {
                      null -> false
                      "http", "https" -> false
                      "tel", "mailto", "sms", "geo" -> {
                          try {
                              startActivity(Intent(Intent.ACTION_VIEW, uri))
                          } catch (_: Exception) {
                          }
                          true
                      }
                      else -> true
                  }
              }

              @SuppressLint("SetJavaScriptEnabled")
              private fun setupWebView() {
                  val wv = webView ?: return
                  val settings = wv.settings

                  settings.javaScriptEnabled = true
                  settings.javaScriptCanOpenWindowsAutomatically = false
                  settings.domStorageEnabled = true
                  settings.databaseEnabled = true
                  settings.loadsImagesAutomatically = true
                  settings.blockNetworkImage = false
                  settings.blockNetworkLoads = false
                  settings.useWideViewPort = true
                  settings.loadWithOverviewMode = true
                  settings.textZoom = 100
                  settings.cacheMode = WebSettings.LOAD_DEFAULT

                  settings.allowFileAccess = false
                  settings.allowContentAccess = true
                  settings.allowFileAccessFromFileURLs = false
                  settings.allowUniversalAccessFromFileURLs = false

                  settings.mixedContentMode = WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE
                  settings.mediaPlaybackRequiresUserGesture = false

                  CookieManager.getInstance().setAcceptCookie(true)
                  CookieManager.getInstance().setAcceptThirdPartyCookies(wv, true)

                  wv.webViewClient = object : WebViewClient() {

                      override fun shouldOverrideUrlLoading(
                          view: WebView?,
                          request: WebResourceRequest?
                      ): Boolean {
                          val uri = request?.url ?: return false
                          return handleScheme(uri)
                      }

                      // Required for Android 6 (API 23), which calls this overload.
                      @Suppress("DEPRECATION", "OVERRIDE_DEPRECATION")
                      override fun shouldOverrideUrlLoading(
                          view: WebView?,
                          url: String?
                      ): Boolean {
                          if (url.isNullOrBlank()) return false
                          return handleScheme(Uri.parse(url))
                      }

                      override fun onReceivedSslError(
                          view: WebView?,
                          handler: SslErrorHandler?,
                          error: android.net.http.SslError?
                      ) {
                          handler?.cancel()
                          Toast.makeText(
                              this@MainActivity,
                              "SSL error while loading the page",
                              Toast.LENGTH_SHORT
                          ).show()
                      }

                      override fun onReceivedError(
                          view: WebView?,
                          request: WebResourceRequest?,
                          error: WebResourceError?
                      ) {
                          if (request?.isForMainFrame == true) {
                              Toast.makeText(
                                  this@MainActivity,
                                  "Page loading error",
                                  Toast.LENGTH_SHORT
                              ).show()
                          }
                      }

                      override fun onReceivedHttpError(
                          view: WebView?,
                          request: WebResourceRequest?,
                          errorResponse: WebResourceResponse?
                      ) {
                      }
                  }

                  wv.webChromeClient = object : WebChromeClient() {

                      override fun onPermissionRequest(request: PermissionRequest?) {
                          request ?: return

                          if (request.origin?.host != WEBSITE_HOST) {
                              request.deny()
                              return
                          }

                          val needed = request.resources.mapNotNull { res ->
                              when (res) {
                                  PermissionRequest.RESOURCE_VIDEO_CAPTURE ->
                                      Manifest.permission.CAMERA
                                  PermissionRequest.RESOURCE_AUDIO_CAPTURE ->
                                      Manifest.permission.RECORD_AUDIO
                                  else -> null
                              }
                          }.distinct()

                          if (needed.isEmpty()) {
                              request.deny()
                              return
                          }

                          val missing = needed.filter { !hasPermission(it) }

                          if (missing.isEmpty()) {
                              request.grant(request.resources)
                          } else {
                              pendingPermissionRequest?.deny()
                              pendingPermissionRequest = request
                              ActivityCompat.requestPermissions(
                                  this@MainActivity,
                                  missing.toTypedArray(),
                                  WEB_PERMISSION_REQUEST_CODE
                              )
                          }
                      }

                      override fun onPermissionRequestCanceled(request: PermissionRequest?) {
                          if (request != null && request == pendingPermissionRequest) {
                              pendingPermissionRequest = null
                          }
                      }

                      override fun onShowFileChooser(
                          webView: WebView?,
                          filePath: ValueCallback<Array<Uri>>?,
                          fileChooserParams: FileChooserParams?
                      ): Boolean {
                          filePathCallback?.onReceiveValue(null)
                          filePathCallback = filePath

                          val intent = try {
                              fileChooserParams?.createIntent()
                                  ?: Intent(Intent.ACTION_OPEN_DOCUMENT).apply {
                                      addCategory(Intent.CATEGORY_OPENABLE)
                                      type = "*/*"
                                  }
                          } catch (_: Exception) {
                              Intent(Intent.ACTION_OPEN_DOCUMENT).apply {
                                  addCategory(Intent.CATEGORY_OPENABLE)
                                  type = "*/*"
                              }
                          }

                          return try {
                              startActivityForResult(
                                  Intent.createChooser(intent, "Select file"),
                                  FILE_CHOOSER_REQUEST_CODE
                              )
                              true
                          } catch (_: Exception) {
                              filePathCallback?.onReceiveValue(null)
                              filePathCallback = null
                              false
                          }
                      }
                  }

                  wv.setDownloadListener(
                      DownloadListener { url, userAgent, contentDisposition, mimeType, _ ->
                          val start = {
                              startDownload(url, userAgent, contentDisposition, mimeType)
                          }

                          // Android 6-9 needs a runtime storage permission for Downloads.
                          if (
                              Build.VERSION.SDK_INT <= Build.VERSION_CODES.P &&
                              !hasPermission(Manifest.permission.WRITE_EXTERNAL_STORAGE)
                          ) {
                              pendingDownload = start
                              ActivityCompat.requestPermissions(
                                  this,
                                  arrayOf(Manifest.permission.WRITE_EXTERNAL_STORAGE),
                                  STORAGE_REQUEST_CODE
                              )
                          } else {
                              start()
                          }
                      }
                  )
              }

              private fun startDownload(
                  url: String,
                  userAgent: String?,
                  contentDisposition: String?,
                  mimeType: String?
              ) {
                  try {
                      val cookies = CookieManager.getInstance().getCookie(url)
                      val fileName = URLUtil.guessFileName(url, contentDisposition, mimeType)

                      val request = DownloadManager.Request(Uri.parse(url)).apply {
                          setTitle(fileName)
                          setDescription("Downloading...")
                          if (!mimeType.isNullOrBlank()) {
                              setMimeType(mimeType)
                          }
                          setNotificationVisibility(
                              DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED
                          )
                          setAllowedOverRoaming(true)
                          setAllowedOverMetered(true)

                          if (!userAgent.isNullOrBlank()) {
                              addRequestHeader("User-Agent", userAgent)
                          }
                          if (!cookies.isNullOrBlank()) {
                              addRequestHeader("Cookie", cookies)
                          }
                          addRequestHeader("Referer", WEBSITE_URL)

                          setDestinationInExternalPublicDir(
                              Environment.DIRECTORY_DOWNLOADS,
                              fileName
                          )
                      }

                      val dm = getSystemService(Context.DOWNLOAD_SERVICE) as DownloadManager
                      dm.enqueue(request)

                      Toast.makeText(
                          this,
                          "Download started: $fileName",
                          Toast.LENGTH_SHORT
                      ).show()
                  } catch (_: Exception) {
                      Toast.makeText(this, "Download error", Toast.LENGTH_SHORT).show()
                  }
              }

              private fun setupBackNavigation() {
                  onBackPressedDispatcher.addCallback(
                      this,
                      object : OnBackPressedCallback(true) {
                          override fun handleOnBackPressed() {
                              val wv = webView

                              if (wv != null && wv.canGoBack()) {
                                  wv.goBack()
                              } else {
                                  isEnabled = false
                                  onBackPressedDispatcher.onBackPressed()
                              }
                          }
                      }
                  )
              }

              override fun onRequestPermissionsResult(
                  requestCode: Int,
                  permissions: Array<out String>,
                  grantResults: IntArray
              ) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)

                  when (requestCode) {
                      WEB_PERMISSION_REQUEST_CODE -> {
                          val request = pendingPermissionRequest
                          pendingPermissionRequest = null
                          request ?: return

                          val allowed = request.resources.filter { res ->
                              when (res) {
                                  PermissionRequest.RESOURCE_VIDEO_CAPTURE ->
                                      hasPermission(Manifest.permission.CAMERA)
                                  PermissionRequest.RESOURCE_AUDIO_CAPTURE ->
                                      hasPermission(Manifest.permission.RECORD_AUDIO)
                                  else -> false
                              }
                          }

                          if (allowed.isEmpty()) {
                              request.deny()
                          } else {
                              request.grant(allowed.toTypedArray())
                          }
                      }

                      STORAGE_REQUEST_CODE -> {
                          val action = pendingDownload
                          pendingDownload = null

                          if (
                              grantResults.isNotEmpty() &&
                              grantResults[0] == PackageManager.PERMISSION_GRANTED
                          ) {
                              action?.invoke()
                          } else {
                              Toast.makeText(
                                  this,
                                  "Storage permission denied",
                                  Toast.LENGTH_SHORT
                              ).show()
                          }
                      }
                  }
              }

              @Suppress("DEPRECATION")
              override fun onActivityResult(
                  requestCode: Int,
                  resultCode: Int,
                  data: Intent?
              ) {
                  super.onActivityResult(requestCode, resultCode, data)

                  if (requestCode != FILE_CHOOSER_REQUEST_CODE) {
                      return
                  }

                  val callback = filePathCallback
                  filePathCallback = null

                  if (callback == null) {
                      return
                  }

                  if (resultCode != Activity.RESULT_OK) {
                      callback.onReceiveValue(null)
                      return
                  }

                  val results: Array<Uri>? = when {
                      data?.clipData != null -> {
                          val clipData = data.clipData!!
                          Array(clipData.itemCount) { i ->
                              clipData.getItemAt(i).uri
                          }
                      }

                      data?.data != null -> {
                          arrayOf(data.data!!)
                      }

                      else -> null
                  }

                  callback.onReceiveValue(results)
              }

              override fun onSaveInstanceState(outState: Bundle) {
                  webView?.saveState(outState)
                  super.onSaveInstanceState(outState)
              }

              override fun onDestroy() {
                  try {
                      contentResolver.unregisterContentObserver(rotationObserver)
                  } catch (_: Exception) {
                  }

                  pendingPermissionRequest?.deny()
                  pendingPermissionRequest = null
                  pendingDownload = null

                  filePathCallback?.onReceiveValue(null)
                  filePathCallback = null

                  webView?.let {
                      it.stopLoading()
                      it.webChromeClient = null
                      it.destroy()
                  }

                  webView = null
                  super.onDestroy()
              }
          }
          EOF

          # ===============================================================
          # Layout
          # ===============================================================
          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:fitsSystemWindows="true">

              <WebView
                  android:id="@+id/webView"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:background="@android:color/white" />

          </FrameLayout>
          EOF

          # ===============================================================
          # Themes
          # ===============================================================
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:colorAccent">#1976D2</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/values-night/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.NoActionBar">
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:colorAccent">#90CAF9</item>
              </style>
          </resources>
          EOF

          # ===============================================================
          # Root build.gradle
          # ===============================================================
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF

          # ===============================================================
          # App build.gradle
          # ===============================================================
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.mohammadkhxm.browser'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.mohammadkhxm.browser'
                  minSdk 23
                  targetSdk 34
                  versionCode 3
                  versionName '1.2'
                  vectorDrawables.useSupportLibrary = true
              }

              splits {
                  abi {
                      enable true
                      reset()
                      include 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
                      universalApk true
                  }
              }

              signingConfigs {
                  release {
                      def keystoreFile = file("$rootDir/yaraniha.keystore")

                      if (!keystoreFile.exists()) {
                          throw new GradleException(
                              "Signing keystore not found: ${keystoreFile.absolutePath}"
                          )
                      }

                      storeFile keystoreFile
                      storePassword System.getenv("KEYSTORE_PASSWORD") ?: ""
                      keyAlias System.getenv("KEY_ALIAS") ?: ""
                      keyPassword System.getenv("KEY_PASSWORD") ?: ""
                      enableV1Signing true
                      enableV2Signing true
                      enableV3Signing true
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled true
                      shrinkResources false
                      debuggable false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
                  }
              }

              packaging {
                  jniLibs {
                      useLegacyPackaging = false
                  }
                  resources {
                      excludes += [
                          'META-INF/*.version',
                          'META-INF/*.kotlin_module',
                          'META-INF/DEPENDENCIES',
                          'META-INF/LICENSE*',
                          'META-INF/NOTICE*'
                      ]
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }

              lint {
                  abortOnError false
                  checkReleaseBuilds false
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.13.1'
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'androidx.activity:activity-ktx:1.9.0'
          }
          EOF

          # ===============================================================
          # settings.gradle
          # ===============================================================
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = 'Yaraniha'
          include ':app'
          EOF

          # ===============================================================
          # gradle.properties
          # ===============================================================
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3072m -XX:+UseParallelGC -Dfile.encoding=UTF-8
          org.gradle.parallel=true
          org.gradle.caching=true
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          android.enableJetifier=false
          kotlin.code.style=official
          EOF

          # ===============================================================
          # Gradle wrapper
          # ===============================================================
          mkdir -p gradle/wrapper

          cat > gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          curl -fsSL --retry 3 \
            "https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar" \
            -o gradle/wrapper/gradle-wrapper.jar

          cat > gradlew <<'EOF'
          #!/bin/sh
          APP_HOME=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)

          exec java \
            -cp "$APP_HOME/gradle/wrapper/gradle-wrapper.jar" \
            org.gradle.wrapper.GradleWrapperMain \
            "$@"
          EOF

          chmod +x gradlew

          echo "Android project generated successfully."

      - name: Preflight Gradle configuration
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew
          ./gradlew --version
          ./gradlew :app:tasks --all >/dev/null

      - name: Build signed Release APKs
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew
          ./gradlew clean assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Verify APK alignment and signatures
        shell: bash
        env:
          PINNED_CERT_SHA256: ${{ secrets.ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail

          APK_DIR="app/build/outputs/apk/release"
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          ZIPALIGN="$ANDROID_HOME/build-tools/34.0.0/zipalign"

          KS_FP="${KEYSTORE_CERT_SHA256:-}"
          PIN="$(printf '%s' "${PINNED_CERT_SHA256:-}" | tr -d ':[:space:]' | tr 'A-F' 'a-f')"

          if [ -z "$KS_FP" ]; then
            echo "ERROR: keystore fingerprint was not captured."
            exit 1
          fi

          mapfile -t APKS < <(find "$APK_DIR" -maxdepth 1 -type f -name "*.apk" | sort)

          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "ERROR: No APK files were produced."
            exit 1
          fi

          printf ' - %s\n' "${APKS[@]}"

          for apk in "${APKS[@]}"; do
            name="$(basename "$apk")"
            echo
            echo "=== VERIFY: $name ==="

            "$ZIPALIGN" -c -p 4 "$apk"

            # --min-sdk-version 23 makes apksigner require a valid v1 signature,
            # which is the only scheme Android 6 understands.
            OUT="$("$APKSIGNER" verify --verbose --print-certs --min-sdk-version 23 "$apk" 2>&1)"
            printf '%s\n' "$OUT"

            for scheme in \
              "v1 scheme (JAR signing)" \
              "v2 scheme (APK Signature Scheme v2)" \
              "v3 scheme (APK Signature Scheme v3)"; do
              grep -qF "Verified using $scheme: true" <<< "$OUT" || {
                echo "ERROR: $scheme verification failed for $name."
                exit 1
              }
            done

            grep -q "Number of signers: 1" <<< "$OUT" || {
              echo "ERROR: $name must have exactly one signer."
              exit 1
            }

            DIGEST="$(grep -m1 -F 'certificate SHA-256 digest:' <<< "$OUT" \
              | awk '{print $NF}' | tr 'A-F' 'a-f' || true)"

            if [ "$DIGEST" != "$KS_FP" ]; then
              echo "ERROR: $name is not signed with the expected keystore."
              echo "  expected: $KS_FP"
              echo "  actual:   $DIGEST"
              exit 1
            fi

            if [ -n "$PIN" ] && [ "$DIGEST" != "$PIN" ]; then
              echo "ERROR: $name certificate does not match secret ANDROID_CERT_SHA256."
              exit 1
            fi

            echo "Signature, alignment and certificate: OK"
          done

          echo
          echo "All APKs are signed with the same fixed certificate: $KS_FP"

      - name: Verify release APK package contents
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="app/build/outputs/apk/release"
          AAPT2="$ANDROID_HOME/build-tools/34.0.0/aapt2"

          if [ ! -x "$AAPT2" ]; then
            echo "ERROR: aapt2 not found at $AAPT2"
            exit 1
          fi

          for apk in "$APK_DIR"/*.apk; do
            name="$(basename "$apk")"
            echo "--- $name ---"

            BADGING="$("$AAPT2" dump badging "$apk")"

            need() {
              grep -Eq "$1" <<< "$BADGING" || {
                echo "ERROR: $2 ($name)"
                exit 1
              }
            }

            need "^package: name='com\.mohammadkhxm\.browser'" "wrong package name"
            need "^sdkVersion:'23'" "minSdkVersion is not 23 (Android 6)"
            need "^application: .*icon='res/" "launcher icon missing"
            need "launchable-activity: name='com\.mohammadkhxm\.browser\.MainActivity'" "launcher activity missing"

            echo "Package metadata OK"
          done

      - name: Verify native ABI libraries per APK
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="app/build/outputs/apk/release"

          for apk in "$APK_DIR"/*.apk; do
            name="$(basename "$apk")"
            echo "--- $name ---"

            case "$name" in
              *arm64-v8a*)   abis=("arm64-v8a") ;;
              *armeabi-v7a*) abis=("armeabi-v7a") ;;
              *x86_64*)      abis=("x86_64") ;;
              *x86*)         abis=("x86") ;;
              *universal*)   abis=("arm64-v8a" "armeabi-v7a" "x86" "x86_64") ;;
              *)             abis=() ;;
            esac

            if [ "${#abis[@]}" -eq 0 ]; then
              echo "Skipping unknown APK: $name"
              continue
            fi

            LISTING="$(unzip -l "$apk")"

            for abi in "${abis[@]}"; do
              grep -q "lib/$abi/libyaraniha_abi.so" <<< "$LISTING" || {
                echo "ERROR: lib/$abi/libyaraniha_abi.so missing from $name"
                exit 1
              }
              echo "  lib/$abi/libyaraniha_abi.so present"
            done
          done

          echo "ABI library check passed."

      - name: Publish APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yaraniha-signed-apks
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/output-metadata.json
          if-no-files-found: error
          retention-days: 30
