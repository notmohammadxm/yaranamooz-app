name: Build Android APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build signed Multi-ABI APKs
    runs-on: ubuntu-24.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.caching=true"
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate repository image
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="yaraniha.png"

          if [ ! -f "$IMAGE" ]; then
            echo "ERROR: $IMAGE was not found in repository root."
            echo "Add the image to the repository root with the exact filename: yaraniha.png"
            exit 1
          fi

          if [ ! -s "$IMAGE" ]; then
            echo "ERROR: $IMAGE exists but is empty."
            exit 1
          fi

          file "$IMAGE"
          ls -lh "$IMAGE"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found at $SDKMANAGER"
            exit 1
          fi

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;27.0.12077973"

      - name: Restore signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          KEYSTORE_FILE="$GITHUB_WORKSPACE/yaraniha.keystore"

          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          if [ -z "${KEYSTORE_PASSWORD:-}" ]; then
            echo "ERROR: ANDROID_KEYSTORE_PASSWORD secret is missing."
            exit 1
          fi

          if [ -z "${KEY_ALIAS:-}" ]; then
            echo "ERROR: ANDROID_KEY_ALIAS secret is missing."
            exit 1
          fi

          if [ -z "${KEY_PASSWORD:-}" ]; then
            echo "ERROR: ANDROID_KEY_PASSWORD secret is missing."
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"

          test -s "$KEYSTORE_FILE"
          chmod 600 "$KEYSTORE_FILE"

          echo "Keystore restored:"
          ls -lh "$KEYSTORE_FILE"

      - name: Validate signing key before build
        shell: bash
        run: |
          set -euo pipefail

          KEYSTORE_FILE="$GITHUB_WORKSPACE/yaraniha.keystore"

          echo "Validating keystore and requested alias..."

          keytool \
            -list \
            -keystore "$KEYSTORE_FILE" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            >/dev/null

          keytool \
            -list \
            -v \
            -keystore "$KEYSTORE_FILE" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            > /tmp/signing-key.txt

          echo "Signing alias:"
          grep -m1 '^Alias name:' /tmp/signing-key.txt || true

          echo "Certificate fingerprints:"
          grep -E 'SHA256:|SHA-256:' /tmp/signing-key.txt || true

      - name: Generate Android project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p app/src/main/java/com/mohammadkhxm/browser
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/values-night
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/drawable

          # Use the real image from the repository.
          cp -f yaraniha.png app/src/main/res/drawable/yaraniha.png

          # ---------------------------------------------------------------
          # Real native marker libraries.
          # These are compiled by the Android NDK so ABI splits are genuine
          # ELF shared libraries, not fabricated ELF headers.
          # ---------------------------------------------------------------
          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/jniLibs/armeabi-v7a
          mkdir -p app/src/main/jniLibs/x86
          mkdir -p app/src/main/jniLibs/x86_64

          cat > /tmp/yaraniha_abi_marker.c <<'EOF'
          __attribute__((visibility("default")))
          void yaraniha_abi_marker(void) {}
          EOF

          NDK="$ANDROID_HOME/ndk/27.0.12077973"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          "$TOOLCHAIN/aarch64-linux-android21-clang" \
            -shared -fPIC -O2 \
            /tmp/yaraniha_abi_marker.c \
            -o app/src/main/jniLibs/arm64-v8a/libyaraniha_abi.so

          "$TOOLCHAIN/armv7a-linux-androideabi21-clang" \
            -shared -fPIC -O2 \
            /tmp/yaraniha_abi_marker.c \
            -o app/src/main/jniLibs/armeabi-v7a/libyaraniha_abi.so

          "$TOOLCHAIN/i686-linux-android21-clang" \
            -shared -fPIC -O2 \
            /tmp/yaraniha_abi_marker.c \
            -o app/src/main/jniLibs/x86/libyaraniha_abi.so

          "$TOOLCHAIN/x86_64-linux-android21-clang" \
            -shared -fPIC -O2 \
            /tmp/yaraniha_abi_marker.c \
            -o app/src/main/jniLibs/x86_64/libyaraniha_abi.so

          file app/src/main/jniLibs/arm64-v8a/libyaraniha_abi.so
          file app/src/main/jniLibs/armeabi-v7a/libyaraniha_abi.so
          file app/src/main/jniLibs/x86/libyaraniha_abi.so
          file app/src/main/jniLibs/x86_64/libyaraniha_abi.so

          # ===============================================================
          # AndroidManifest.xml
          # ===============================================================
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission
                  android:name="android.permission.WRITE_EXTERNAL_STORAGE"
                  android:maxSdkVersion="28" />

              <uses-feature
                  android:name="android.hardware.camera"
                  android:required="false" />

              <uses-feature
                  android:name="android.hardware.camera.autofocus"
                  android:required="false" />

              <application
                  android:allowBackup="false"
                  android:hardwareAccelerated="true"
                  android:icon="@drawable/yaraniha"
                  android:label="Yaraniha"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme"
                  android:networkSecurityConfig="@xml/network_security_config"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize|screenLayout|keyboardHidden|uiMode"
                      android:exported="true"
                      android:hardwareAccelerated="true"
                      android:launchMode="singleTask"
                      android:windowSoftInputMode="adjustResize">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          # ===============================================================
          # Network Security Config
          # Needed for legacy HTTP image/CDN URLs used as WebView subresources.
          # ===============================================================
          cat > app/src/main/res/xml/network_security_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted="true" />
          </network-security-config>
          EOF

          # ===============================================================
          # MainActivity.kt
          # ===============================================================
          cat > app/src/main/java/com/mohammadkhxm/browser/MainActivity.kt <<'EOF'
          package com.mohammadkhxm.browser

          import android.Manifest
          import android.annotation.SuppressLint
          import android.app.Activity
          import android.app.DownloadManager
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Environment
          import android.view.View
          import android.webkit.CookieManager
          import android.webkit.DownloadListener
          import android.webkit.PermissionRequest
          import android.webkit.SslErrorHandler
          import android.webkit.URLUtil
          import android.webkit.ValueCallback
          import android.webkit.WebChromeClient
          import android.webkit.WebResourceError
          import android.webkit.WebResourceRequest
          import android.webkit.WebResourceResponse
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.Toast
          import androidx.activity.OnBackPressedCallback
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat

          class MainActivity : AppCompatActivity() {

              private var webView: WebView? = null
              private var filePathCallback: ValueCallback<Array<Uri>>? = null
              private var pendingPermissionRequest: PermissionRequest? = null

              companion object {
                  private const val WEBSITE_URL = "https://app.yaran.info"
                  private const val WEBSITE_HOST = "app.yaran.info"
                  private const val FILE_CHOOSER_REQUEST_CODE = 1001
                  private const val PERMISSION_REQUEST_CODE = 2001
                  private const val CAMERA_FROM_WEBVIEW_REQUEST_CODE = 2002
              }

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  setContentView(R.layout.activity_main)

                  webView = findViewById(R.id.webView)
                  setupWebView()
                  setupBackNavigation()

                  if (savedInstanceState == null) {
                      webView?.loadUrl(WEBSITE_URL)
                  } else {
                      webView?.restoreState(savedInstanceState)
                  }
              }

              @SuppressLint("SetJavaScriptEnabled")
              private fun setupWebView() {
                  val wv = webView ?: return
                  val settings = wv.settings

                  settings.javaScriptEnabled = true
                  settings.javaScriptCanOpenWindowsAutomatically = false
                  settings.domStorageEnabled = true
                  settings.databaseEnabled = true
                  settings.loadsImagesAutomatically = true
                  settings.blockNetworkImage = false
                  settings.blockNetworkLoads = false
                  settings.useWideViewPort = true
                  settings.loadWithOverviewMode = true
                  settings.cacheMode = WebSettings.LOAD_DEFAULT

                  // Keep local/file access restricted.
                  settings.allowFileAccess = false
                  settings.allowContentAccess = true
                  settings.allowFileAccessFromFileURLs = false
                  settings.allowUniversalAccessFromFileURLs = false

                  // Compatibility mode lets legacy HTTP image/CDN subresources
                  // render inside the HTTPS site.
                  settings.mixedContentMode = WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE

                  settings.mediaPlaybackRequiresUserGesture = false

                  CookieManager.getInstance().setAcceptCookie(true)
                  CookieManager.getInstance().setAcceptThirdPartyCookies(wv, true)

                  wv.setLayerType(View.LAYER_TYPE_HARDWARE, null)

                  wv.webViewClient = object : WebViewClient() {

                      override fun shouldOverrideUrlLoading(
                          view: WebView?,
                          request: WebResourceRequest?
                      ): Boolean {
                          val uri = request?.url ?: return false
                          val scheme = uri.scheme?.lowercase() ?: return false

                          return when (scheme) {
                              "http", "https" -> false
                              "tel", "mailto", "sms", "geo" -> {
                                  try {
                                      startActivity(Intent(Intent.ACTION_VIEW, uri))
                                  } catch (_: Exception) {
                                  }
                                  true
                              }
                              else -> true
                          }
                      }

                      @Suppress("DEPRECATION")
                      override fun shouldOverrideUrlLoading(
                          view: WebView?,
                          url: String?
                      ): Boolean {
                          if (url.isNullOrBlank()) return false

                          val uri = Uri.parse(url)
                          val scheme = uri.scheme?.lowercase() ?: return false

                          return when (scheme) {
                              "http", "https" -> false
                              "tel", "mailto", "sms", "geo" -> {
                                  try {
                                      startActivity(Intent(Intent.ACTION_VIEW, uri))
                                  } catch (_: Exception) {
                                  }
                                  true
                              }
                              else -> true
                          }
                      }

                      override fun onReceivedSslError(
                          view: WebView?,
                          handler: SslErrorHandler?,
                          error: android.net.http.SslError?
                      ) {
                          handler?.cancel()
                          Toast.makeText(
                              this@MainActivity,
                              "SSL error while loading the page",
                              Toast.LENGTH_SHORT
                          ).show()
                      }

                      override fun onReceivedError(
                          view: WebView?,
                          request: WebResourceRequest?,
                          error: WebResourceError?
                      ) {
                          if (request?.isForMainFrame == true) {
                              Toast.makeText(
                                  this@MainActivity,
                                  "Page loading error",
                                  Toast.LENGTH_SHORT
                              ).show()
                          }
                      }

                      override fun onReceivedHttpError(
                          view: WebView?,
                          request: WebResourceRequest?,
                          errorResponse: WebResourceResponse?
                      ) {
                          // Do not interrupt image/resource loading with a Toast.
                      }
                  }

                  wv.webChromeClient = object : WebChromeClient() {

                      override fun onPermissionRequest(request: PermissionRequest?) {
                          request ?: return

                          val originHost = try {
                              Uri.parse(request.origin.toString()).host
                          } catch (_: Exception) {
                              null
                          }

                          if (originHost != WEBSITE_HOST) {
                              request.deny()
                              return
                          }

                          val requested = request.resources.toSet()

                          if (
                              PermissionRequest.RESOURCE_VIDEO_CAPTURE in requested ||
                              PermissionRequest.RESOURCE_AUDIO_CAPTURE in requested
                          ) {
                              if (
                                  ContextCompat.checkSelfPermission(
                                      this@MainActivity,
                                      Manifest.permission.CAMERA
                                  ) == PackageManager.PERMISSION_GRANTED
                              ) {
                                  request.grant(request.resources)
                              } else {
                                  pendingPermissionRequest = request
                                  ActivityCompat.requestPermissions(
                                      this@MainActivity,
                                      arrayOf(Manifest.permission.CAMERA),
                                      CAMERA_FROM_WEBVIEW_REQUEST_CODE
                                  )
                              }
                          } else {
                              request.deny()
                          }
                      }

                      override fun onShowFileChooser(
                          webView: WebView?,
                          filePath: ValueCallback<Array<Uri>>?,
                          fileChooserParams: FileChooserParams?
                      ): Boolean {
                          filePathCallback?.onReceiveValue(null)
                          filePathCallback = filePath

                          val intent = try {
                              fileChooserParams?.createIntent()
                                  ?: Intent(Intent.ACTION_OPEN_DOCUMENT).apply {
                                      addCategory(Intent.CATEGORY_OPENABLE)
                                      type = "*/*"
                                  }
                          } catch (_: Exception) {
                              Intent(Intent.ACTION_OPEN_DOCUMENT).apply {
                                  addCategory(Intent.CATEGORY_OPENABLE)
                                  type = "*/*"
                              }
                          }

                          return try {
                              startActivityForResult(
                                  Intent.createChooser(intent, "Select file"),
                                  FILE_CHOOSER_REQUEST_CODE
                              )
                              true
                          } catch (_: Exception) {
                              filePathCallback?.onReceiveValue(null)
                              filePathCallback = null
                              false
                          }
                      }
                  }

                  wv.setDownloadListener(
                      DownloadListener { url, userAgent, contentDisposition, mimeType, _ ->
                          try {
                              val uri = Uri.parse(url)
                              val cookies = CookieManager.getInstance().getCookie(url)
                              val fileName = URLUtil.guessFileName(
                                  url,
                                  contentDisposition,
                                  mimeType
                              )

                              val request = DownloadManager.Request(uri).apply {
                                  setTitle(fileName)
                                  setDescription("Downloading...")
                                  if (!mimeType.isNullOrBlank()) {
                                      setMimeType(mimeType)
                                  }
                                  setNotificationVisibility(
                                      DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED
                                  )
                                  setAllowedOverRoaming(true)

                                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.N) {
                                      setAllowedOverMetered(true)
                                  }

                                  if (!userAgent.isNullOrBlank()) {
                                      addRequestHeader("User-Agent", userAgent)
                                  }

                                  if (!cookies.isNullOrBlank()) {
                                      addRequestHeader("Cookie", cookies)
                                  }

                                  addRequestHeader("Referer", WEBSITE_URL)
                                  setDestinationInExternalPublicDir(
                                      Environment.DIRECTORY_DOWNLOADS,
                                      fileName
                                  )
                              }

                              val dm =
                                  getSystemService(Context.DOWNLOAD_SERVICE)
                                      as DownloadManager

                              dm.enqueue(request)

                              Toast.makeText(
                                  this,
                                  "Download started: $fileName",
                                  Toast.LENGTH_SHORT
                              ).show()
                          } catch (_: Exception) {
                              Toast.makeText(
                                  this,
                                  "Download error",
                                  Toast.LENGTH_SHORT
                              ).show()
                          }
                      }
                  )
              }

              private fun setupBackNavigation() {
                  onBackPressedDispatcher.addCallback(
                      this,
                      object : OnBackPressedCallback(true) {
                          override fun handleOnBackPressed() {
                              val wv = webView

                              if (wv != null && wv.canGoBack()) {
                                  wv.goBack()
                              } else {
                                  isEnabled = false
                                  onBackPressedDispatcher.onBackPressed()
                              }
                          }
                      }
                  )
              }

              override fun onRequestPermissionsResult(
                  requestCode: Int,
                  permissions: Array<out String>,
                  grantResults: IntArray
              ) {
                  super.onRequestPermissionsResult(
                      requestCode,
                      permissions,
                      grantResults
                  )

                  if (requestCode != CAMERA_FROM_WEBVIEW_REQUEST_CODE) {
                      return
                  }

                  val request = pendingPermissionRequest
                  pendingPermissionRequest = null

                  if (request == null) {
                      return
                  }

                  val granted =
                      grantResults.isNotEmpty() &&
                          grantResults[0] == PackageManager.PERMISSION_GRANTED

                  if (granted) {
                      request.grant(request.resources)
                  } else {
                      request.deny()
                  }
              }

              @Suppress("DEPRECATION")
              override fun onActivityResult(
                  requestCode: Int,
                  resultCode: Int,
                  data: Intent?
              ) {
                  super.onActivityResult(requestCode, resultCode, data)

                  if (requestCode != FILE_CHOOSER_REQUEST_CODE) {
                      return
                  }

                  val callback = filePathCallback
                  filePathCallback = null

                  if (callback == null) {
                      return
                  }

                  if (resultCode != Activity.RESULT_OK) {
                      callback.onReceiveValue(null)
                      return
                  }

                  val results: Array<Uri>? = when {
                      data?.clipData != null -> {
                          val clipData = data.clipData!!
                          Array(clipData.itemCount) { i ->
                              clipData.getItemAt(i).uri
                          }
                      }

                      data?.data != null -> {
                          arrayOf(data.data!!)
                      }

                      else -> null
                  }

                  callback.onReceiveValue(results)
              }

              override fun onSaveInstanceState(outState: Bundle) {
                  webView?.saveState(outState)
                  super.onSaveInstanceState(outState)
              }

              override fun onDestroy() {
                  pendingPermissionRequest?.deny()
                  pendingPermissionRequest = null

                  filePathCallback?.onReceiveValue(null)
                  filePathCallback = null

                  webView?.let {
                      it.stopLoading()
                      it.webChromeClient = null
                      it.destroy()
                  }

                  webView = null
                  super.onDestroy()
              }
          }
          EOF

          # ===============================================================
          # Layout
          # ===============================================================
          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:fitsSystemWindows="true">

              <WebView
                  android:id="@+id/webView"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:background="@android:color/white" />

          </FrameLayout>
          EOF

          # ===============================================================
          # Themes
          # ===============================================================
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:colorAccent">#1976D2</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/values-night/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.NoActionBar">
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:colorAccent">#90CAF9</item>
              </style>
          </resources>
          EOF

          # ===============================================================
          # Root build.gradle
          # ===============================================================
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF

          # ===============================================================
          # App build.gradle
          # ===============================================================
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.mohammadkhxm.browser'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.mohammadkhxm.browser'
                  minSdk 23
                  targetSdk 34
                  versionCode 2
                  versionName '1.1'
                  vectorDrawables.useSupportLibrary = true
              }

              splits {
                  abi {
                      enable true
                      reset()
                      include 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
                      universalApk true
                  }
              }

              signingConfigs {
                  release {
                      def keystoreFile = file("$rootDir/yaraniha.keystore")

                      if (!keystoreFile.exists()) {
                          throw new GradleException(
                              "Signing keystore not found: ${keystoreFile.absolutePath}"
                          )
                      }

                      storeFile keystoreFile
                      storePassword System.getenv("KEYSTORE_PASSWORD") ?: ""
                      keyAlias System.getenv("KEY_ALIAS") ?: ""
                      keyPassword System.getenv("KEY_PASSWORD") ?: ""
                      enableV1Signing true
                      enableV2Signing true
                      enableV3Signing true
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      shrinkResources false
                      debuggable false
                  }
              }

              packaging {
                  jniLibs {
                      useLegacyPackaging = false
                  }
                  resources {
                      excludes += [
                          'META-INF/*.version',
                          'META-INF/*.kotlin_module',
                          'META-INF/DEPENDENCIES',
                          'META-INF/LICENSE*',
                          'META-INF/NOTICE*'
                      ]
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }

              lint {
                  abortOnError false
                  checkReleaseBuilds false
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.13.1'
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'androidx.activity:activity-ktx:1.9.0'
          }
          EOF

          # ===============================================================
          # settings.gradle
          # ===============================================================
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = 'Yaraniha'
          include ':app'
          EOF

          # ===============================================================
          # gradle.properties
          # ===============================================================
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          org.gradle.parallel=true
          org.gradle.caching=true
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          android.enableJetifier=false
          kotlin.code.style=official
          EOF

          # ===============================================================
          # Gradle wrapper
          # ===============================================================
          mkdir -p gradle/wrapper

          cat > gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          curl -fsSL \
            "https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar" \
            -o gradle/wrapper/gradle-wrapper.jar

          cat > gradlew <<'EOF'
          #!/bin/sh
          APP_HOME=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)

          exec java \
            -cp "$APP_HOME/gradle/wrapper/gradle-wrapper.jar" \
            org.gradle.wrapper.GradleWrapperMain \
            "$@"
          EOF

          chmod +x gradlew

          echo "Android project generated successfully."
          echo "Repository image copied to app/src/main/res/drawable/yaraniha.png"

      - name: Preflight Gradle configuration
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew
          ./gradlew --version
          ./gradlew :app:tasks --all >/dev/null

      - name: Build signed Release APKs
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew
          ./gradlew clean assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Verify APK alignment and signatures
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="app/build/outputs/apk/release"
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          ZIPALIGN="$ANDROID_HOME/build-tools/34.0.0/zipalign"

          mapfile -t APKS < <(find "$APK_DIR" -maxdepth 1 -type f -name "*.apk" | sort)

          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "ERROR: No APK files were produced."
            exit 1
          fi

          echo "APKs:"
          printf ' - %s\n' "${APKS[@]}"

          for apk in "${APKS[@]}"; do
            echo
            echo "=============================================================="
            echo "VERIFY: $(basename "$apk")"
            echo "=============================================================="

            "$ZIPALIGN" -c -p -v 4 "$apk"

            VERIFY_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs "$apk" 2>&1)"
            printf '%s\n' "$VERIFY_OUTPUT"

            grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" \
              <<< "$VERIFY_OUTPUT" || {
                echo "ERROR: v2 signature verification failed for $(basename "$apk")."
                exit 1
              }

            grep -q "Verified using v3 scheme (APK Signature Scheme v3): true" \
              <<< "$VERIFY_OUTPUT" || {
                echo "ERROR: v3 signature verification failed for $(basename "$apk")."
                exit 1
              }

            grep -q "Number of signers: 1" \
              <<< "$VERIFY_OUTPUT" || {
                echo "ERROR: APK must have exactly one signer."
                exit 1
              }

            echo "Signature and alignment: OK"
          done

          echo
          echo "All APK signatures verified successfully."

          KEYSTORE_CERT_SHA256="$(
            keytool -list -v \
              -keystore "$GITHUB_WORKSPACE/yaraniha.keystore" \
              -storepass "$KEYSTORE_PASSWORD" \
              -alias "$KEY_ALIAS" |
            awk -F': ' '
              /Certificate fingerprints:/ { in_fp=1; next }
              in_fp && /SHA256:/ { print $2; exit }
            '
          )"

          if [ -z "$KEYSTORE_CERT_SHA256" ]; then
            echo "ERROR: Could not read SHA-256 certificate fingerprint from keystore."
            exit 1
          fi

          KEYSTORE_CERT_SHA256="$(printf '%s' "$KEYSTORE_CERT_SHA256" | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          echo "Expected signing certificate SHA-256: $KEYSTORE_CERT_SHA256"

          for apk in "${APKS[@]}"; do
            VERIFY_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs "$apk" 2>&1)"
            APK_CERT_SHA256="$(
              printf '%s\n' "$VERIFY_OUTPUT" |
              awk -F': ' '/Signer #1 certificate SHA-256 digest:/ { print $2; exit }'
            )"

            if [ -z "$APK_CERT_SHA256" ]; then
              echo "ERROR: Could not read APK signer SHA-256 fingerprint from $(basename "$apk")."
              exit 1
            fi

            APK_CERT_SHA256="$(printf '%s' "$APK_CERT_SHA256" | tr -d ':' | tr '[:lower:]' '[:upper:]')"

            if [ "$APK_CERT_SHA256" != "$KEYSTORE_CERT_SHA256" ]; then
              echo "ERROR: Signing certificate mismatch for $(basename "$apk")."
              echo "Expected: $KEYSTORE_CERT_SHA256"
              echo "Actual:   $APK_CERT_SHA256"
              exit 1
            fi

            echo "Certificate match: OK ($(basename "$apk"))"
          done

          echo "Signing certificate identity verified for every APK."

      - name: Verify release APK package contents
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="app/build/outputs/apk/release"
          AAPT2="$ANDROID_HOME/build-tools/34.0.0/aapt2"

          if [ ! -x "$AAPT2" ]; then
            echo "ERROR: aapt2 not found at $AAPT2"
            exit 1
          fi

          echo "Checking that drawable/yaraniha is present in the compiled resource table..."

          for apk in "$APK_DIR"/*.apk; do
            echo "--- $(basename "$apk") ---"

            # Release builds shorten resource file paths inside the APK
            # (e.g. res/drawable/yaraniha.png -> res/-B.png), so we cannot
            # grep the zip listing for the original path. Instead we ask
            # aapt2 to read the compiled resource table (resources.arsc)
            # and confirm the logical entry exists.
            #
            # Note: we deliberately do NOT grep AndroidManifest.xml for
            # "drawable/yaraniha" -- the compiled manifest stores a numeric
            # resource ID (e.g. 0x7f080000), not the string form.
            "$AAPT2" dump resources "$apk" \
              | grep -q "drawable/yaraniha" || {
                echo "ERROR: drawable/yaraniha is missing from $(basename "$apk")"
                exit 1
              }

            echo "Drawable resource present."
          done

          echo
          echo "Resource check passed for all APKs."

      - name: Verify native ABI libraries per APK
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="app/build/outputs/apk/release"

          echo "Checking that each split APK contains the expected ABI library..."

          for apk in "$APK_DIR"/*.apk; do
            name="$(basename "$apk")"
            echo "--- $name ---"

            case "$name" in
              *arm64-v8a*)
                abis=("arm64-v8a")
                ;;
              *armeabi-v7a*)
                abis=("armeabi-v7a")
                ;;
              *x86_64*)
                abis=("x86_64")
                ;;
              *x86*)
                abis=("x86")
                ;;
              *universal*)
                abis=("arm64-v8a" "armeabi-v7a" "x86" "x86_64")
                ;;
              *)
                abis=()
                ;;
            esac

            if [ "${#abis[@]}" -eq 0 ]; then
              echo "Skipping unknown APK: $name"
              continue
            fi

            for abi in "${abis[@]}"; do
              unzip -l "$apk" | grep -q "lib/$abi/libyaraniha_abi.so" || {
                echo "ERROR: lib/$abi/libyaraniha_abi.so missing from $name"
                exit 1
              }
              echo "  lib/$abi/libyaraniha_abi.so present"
            done
          done

          echo
          echo "ABI library check passed."

      - name: Publish APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yaraniha-signed-apks
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/output-metadata.json
          if-no-files-found: error
          retention-days: 30
